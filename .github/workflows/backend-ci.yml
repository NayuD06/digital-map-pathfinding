name: Backend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: BE

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: BE/requirements.txt

      - name: Cài thư viện
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt ruff

      - name: Kiểm tra code (ruff)
        run: ruff check .

      - name: Kiểm tra cú pháp
        run: python -m compileall -q app tests

      - name: Chạy test (pytest)
        # Mã thoát 5 = chưa có test nào, coi là đạt khi dự án mới có khung
        run: pytest || [ $? -eq 5 ]
